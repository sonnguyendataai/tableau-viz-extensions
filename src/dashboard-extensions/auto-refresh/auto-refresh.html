<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto Refresh — Dashboard Extension</title>

  <!-- Extensions API (vendored, MIT) — BẮT BUỘC nạp trước auto-refresh.js. -->
  <script src="../../../lib/tableau.extensions.1.latest.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Benton Sans', 'Helvetica Neue', Arial, sans-serif; color: #333;
      box-sizing: border-box; padding: 4px;
    }

    /* Vòng đếm ngược co giãn theo zone, giữ tỉ lệ vuông. */
    #ring { width: min(100%, calc(100vh - 22px)); height: auto; max-height: calc(100vh - 22px);
            cursor: pointer; user-select: none; -webkit-user-select: none; }
    #ring-track { stroke: #e6e6e6; }
    #ring-arc   { stroke: #4e79a7; transition: stroke-dashoffset .25s linear; }
    #ring-label { font-size: 24px; font-weight: 700; fill: #333; }
    #ring-sub   { font-size: 9px; fill: #777; }

    body.is-paused #ring-arc { stroke: #bab0ac; }
    body.has-error #ring-arc { stroke: #e15759; }

    #status {
      max-width: 100%; height: 16px; line-height: 16px;
      font-size: 10px; color: #777; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    body.has-error #status { color: #e15759; }
  </style>
</head>
<body>
  <svg id="ring" viewBox="0 0 100 100" role="button" aria-label="Đếm ngược refresh — click để tạm dừng/tiếp tục">
    <title>Click để tạm dừng / tiếp tục</title>
    <circle id="ring-track" cx="50" cy="50" r="42" fill="none" stroke-width="7" />
    <!-- dasharray = 2πr (r=42); dashoffset do auto-refresh.js set theo thời gian còn lại. -->
    <circle id="ring-arc" cx="50" cy="50" r="42" fill="none" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="263.894" stroke-dashoffset="0" transform="rotate(-90 50 50)" />
    <text id="ring-label" x="50" y="53" text-anchor="middle">…</text>
    <text id="ring-sub" x="50" y="67" text-anchor="middle"></text>
  </svg>
  <div id="status"></div>

  <script type="module" src="./auto-refresh.js"></script>
</body>
</html>
